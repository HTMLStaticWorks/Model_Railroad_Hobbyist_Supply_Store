<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Model Railroad & Hobbyist Supply Store</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    .auth-bg {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      object-fit: cover;
      z-index: -2;
    }
    .auth-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.7);
      z-index: -1;
    }
  </style>
</head>
<body>

  <div class="auth-page">
    <img src="assets/images/hero_image.png" alt="Background" class="auth-bg">
    <div class="auth-overlay"></div>
    
    <div class="auth-card">
      <div class="text-center" style="margin-bottom: 2rem;">
        <a href="index.html" class="logo" style="justify-content: center;">
          <i class="fas fa-train"></i>
          <span>ModelRail</span>
        </a>
        <p style="color: var(--text-light); margin-top: 0.5rem;">Welcome back! Please enter your details.</p>
      </div>
      
      <form action="index.html">
        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" placeholder="Enter your email" required>
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" class="form-control" placeholder="Enter your password" required>
        </div>
        
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; font-size: 0.875rem;">
          <label style="display: flex; align-items: center; gap: 0.5rem; color: var(--text-light); cursor: pointer;">
            <input type="checkbox"> Remember me
          </label>
          <a href="#" style="color: var(--primary); font-weight: 500;">Forgot password?</a>
        </div>
        
        <button type="submit" class="btn btn-primary auth-btn">Sign in</button>
      </form>
      
      <p class="text-center" style="margin-top: 2rem; color: var(--text-light); font-size: 0.875rem;">
        Don't have an account? <a href="register.html" style="color: var(--primary); font-weight: 500;">Sign up</a>
      </p>
      <div style="position: absolute; top: 1rem; right: 1rem;">
        <button class="theme-toggle" aria-label="Toggle Dark Mode" style="background: rgba(255,255,255,0.1); color: #fff;">
          <i class="fas fa-moon"></i>
        </button>
      </div>
    </div>
  </div>

  <script src="assets/js/main.js"></script>
</body>
</html>
